/* ---------------- тексти для читання ---------------- */
function normWord(s){ return s.toLowerCase().replace(/[¿¡.,;:!?"«»()\u2014\u2013]/g,"").replace(/[\u2019']$/,"").trim(); }
function glossify(str,gloss){
  const tok=str.split(/(\s+)/); let out=[], i=0;
  while(i<tok.length){
    if(/^\s*$/.test(tok[i])){ out.push(esc(tok[i])); i++; continue; }
    let hit=null;
    for(let n=3;n>=1;n--){
      const span=tok.slice(i,i+n*2-1).join("");
      const key=normWord(span);
      if(key && gloss[key]){ hit={n,span,key}; break; }
    }
    if(hit){ out.push(`<span class="gl" data-t="${ea(gloss[hit.key])}" data-w="${ea(hit.span)}" onclick="glossTap(this)">${esc(hit.span)}</span>`); i+=hit.n*2-1; }
    else { out.push(esc(tok[i])); i++; }
  }
  return out.join("");
}
function renderPar(par,gloss){
  return par.split(/\*\*(.+?)\*\*/g).map((p,i)=> i%2 ? `<b class="hg">${glossify(p,gloss)}</b>` : glossify(p,gloss)).join("");
}
function glossTap(el){
  toast(el.dataset.w+" — "+el.dataset.t);
  say(el.dataset.w, view.c||"en");
}
function plainPar(par){ return par.replace(/\*\*/g,""); }
function tabTexts(c){
  const list=TEXTS.filter(t=>t.c===c.id);
  return list.map(t=>`<button class="lesson" onclick="go({s:'text',c:'${c.id}',id:'${t.id}',tr:false})">
      <span class="n" style="font-size:13px">${t.level}</span>
      <span class="l"><h3>${esc(t.title)}</h3><p>${esc(t.sub)} · ${t.par.length} абзаци · ${t.q.length} питання</p></span>
    </button>`).join("") || `<div class="empty">Текстів поки немає.</div>`;
}
function screenText(){
  const c=COURSES[view.c]; setAccent(c);
  const t=TEXTS.find(x=>x.id===view.id);
  const pars=t.par.map((p,i)=>`<div class="tpar">
      <div class="ptxt">${renderPar(p,t.gloss)}</div>
      <div class="prow">${spk(plainPar(p),c.id)}${view.tr?`<div class="ptr">${esc(t.tr[i])}</div>`:""}</div>
    </div>`).join("");
  return header("Текст · "+t.level,`go({s:'course',c:'${c.id}',tab:'base'})`)+`<div class="wrap">
    <div class="lhero"><div class="num">${t.level} · ЧИТАННЯ</div><h1>${esc(t.title)}</h1></div>
    <div class="goal">Підкреслені слова можна натиснути — покажу переклад і прочитаю вголос. Виділені кольором місця — це ${esc(t.sub)}.</div>
    <div class="card">${pars}</div>
    <div class="row">
      <button class="btn ghost sm" onclick="view.tr=!view.tr;render()">${view.tr?"Сховати переклад":"Показати переклад"}</button>
      <button class="btn ghost sm" onclick="sayAll('${t.id}')">Прослухати весь текст</button>
    </div>
    <button class="btn" onclick="startTextQ('${t.id}')">Питання до тексту · ${t.q.length}</button>
    <div class="foot">${t.par.join(" ").split(/\s+/).length} слів</div>
  </div>`;
}
function sayAll(id){
  const t=TEXTS.find(x=>x.id===id);
  say(t.par.map(plainPar).join(" "), t.c);
}
function startTextQ(id){
  const t=TEXTS.find(x=>x.id===id);
  go({s:"ex",mode:"text",textId:id,c:t.c,items:t.q.map(q=>Object.assign({t:"choice"},q,{from:"Текст: "+t.title})),i:0,ok:0,log:[]});
}

/* ---------------- урок ---------------- */
function theory(l,cid){
  return l.theory.map(b=>{
    if(b.h) return `<h4>${md(b.h)}</h4>`;
    if(b.p) return `<p>${md(b.p)}</p>`;
    if(b.slab) return `<div class="slab"><div class="formula">${hl(b.slab).replace(/\n/g,"<br>")}</div></div>`;
    if(b.warn) return `<div class="warn"><b>Обережно</b>${md(b.warn)}</div>`;
    if(b.list) return `<ul>${b.list.map(x=>`<li>${md(x)}</li>`).join("")}</ul>`;
    if(b.ex) return `<ul class="ex">${b.ex.map(p=>`<li><b>${esc(p[0])} ${spk(p[0],cid)}</b><span>${esc(p[1])}</span></li>`).join("")}</ul>`;
    if(b.tbl) return `<div class="slab"><table><tr>${b.tbl.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>
      ${b.tbl.rows.map(r=>`<tr>${r.map(cl=>`<td>${hl(cl)}</td>`).join("")}</tr>`).join("")}</table></div>`;
    return "";
  }).join("");
}
function moreBlock(l,cid){
  const m = typeof MORE!=="undefined" && MORE[l.id];
  if(!m || !m.length) return "";
  return `<div class="card"><div class="sectitle"><span>більше прикладів</span><i></i></div>
    <ul class="ex">${m.map(p=>`<li><b>${esc(p[0])} ${spk(p[0],cid)}</b><span>${esc(p[1])}</span></li>`).join("")}</ul></div>`;
}
function screenLesson(){
  const l=ALL.find(x=>x.id===view.id), c=courseOf(l.id); setAccent(c);
  const st=lp(l.id);
  const inDeck=l.words.filter(w=>P.cards.some(x=>x.id===cardId(c.id,w.w))).length;
  const sec=(label,inner)=>`<div class="sec"><div class="sectitle"><span>${label}</span><i></i></div>${inner}</div>`;
  const words=`<div class="card">${l.words.map(w=>`<div class="word">${spk(clean(w.w),c.id)}
      <div class="l"><div class="w">${esc(w.w)}</div><div class="tr">${esc(w.t)}</div><div class="s">${esc(w.s)}</div></div></div>`).join("")}</div>
    <button class="btn ghost sm" onclick="pushCards('${l.id}','words')">${inDeck>=l.words.length?"Усі слова вже в картках":"Додати "+(l.words.length-inDeck)+" слів у картки"}</button>`;
  const patsIn=l.pats.filter(p=>P.cards.some(x=>x.id===cardId(c.id,p.f))).length;
  const pats=`<div class="card">${l.pats.map(p=>`<div class="pat"><div class="f">${esc(p.f)}</div><div class="t">${esc(p.t)}</div>
    <div class="s">${esc(p.s)} ${spk(p.s,c.id)}</div></div>`).join("")}</div>
    <button class="btn ghost sm" onclick="pushCards('${l.id}','pats')">${patsIn>=l.pats.length?"Усі конструкції вже в картках":"Додати "+(l.pats.length-patsIn)+" конструкцій у картки"}</button>`;
  const rate = st.rate!=null ? `<div style="text-align:center;color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:12px;margin-top:8px">минулий результат: ${Math.round(st.rate*100)}%</div>` : "";
  return header(c.name+" · урок "+l.num,`go({s:'course',c:'${c.id}',tab:'prog'})`) + `<div class="wrap">
    <div class="lhero">
      <div class="num">${l.level} · УРОК ${l.num}</div>
      <h1>${esc(l.title)}</h1>
      <div class="goal">${esc(l.goal)}</div>
    </div>
    ${sec("Пояснення",`<div class="tx">${theory(l,c.id)}</div>`+moreBlock(l,c.id))}
    ${sec("Слова уроку · "+l.words.length,words)}
    ${sec("Конструкції",pats)}
    ${sec("Вправи · "+l.ex.length,`<button class="btn" onclick="startLesson('${l.id}')">${st.rate!=null?"Пройти ще раз":"Почати вправи"}</button>${rate}`)}
    ${sec("Домашнє завдання",`<div class="card hw"><p style="margin:0 0 10px">${esc(l.hw)}</p>
      <textarea id="hw" placeholder="Пишіть тут — текст збережеться на цьому пристрої">${esc(st.hw||"")}</textarea>
      <button class="btn ghost sm save" onclick="saveHw('${l.id}')">Зберегти</button><div id="hwmsg"></div></div>`)}
    <button class="btn ${st.done?"ghost":""}" onclick="toggleDone('${l.id}')">${st.done?"Позначено як пройдений — скасувати":"Позначити урок пройденим"}</button>
    <div class="foot">Урок ${l.num} з ${c.lessons.length}</div>
  </div>`;
}
function pushCards(id,what){
  const n=addLessonCards(id,what);
  toast(n?n+" "+plural(n,"картка додана","картки додано","карток додано"):"Ці слова вже є у ваших картках");
  render();
}
function saveHw(id){
  lp(id).hw=document.getElementById("hw").value; touchDay(); saveP();
  document.getElementById("hwmsg").innerHTML='<div class="saved">Збережено</div>';
}
function toggleDone(id){
  const st=lp(id);
  if(st.done){ st.done=false; } else { st.done=true; addXp(50); addLessonCards(id); }
  saveP(); render();
}
function startLesson(id){
  const l=ALL.find(x=>x.id===id);
  go({s:"ex", mode:"lesson", id, c:courseOf(id).id, items:l.ex.map(e=>Object.assign({},e)), i:0, ok:0, log:[]});
}

/* ---------------- вправи ---------------- */
function screenEx(){
  const c=COURSES[view.c]; setAccent(c);
  const title = view.mode==="lesson" ? "Вправи · "+ALL.find(x=>x.id===view.id).title
    : view.mode==="text" ? "Питання до тексту" : view.mode==="errs" ? "Робота над помилками" : "Тренажер";
  const back = view.mode==="lesson" ? `go({s:'lesson',id:'${view.id}'})`
    : view.mode==="text" ? `go({s:'text',c:'${c.id}',id:'${view.textId}',tr:false})`
    : view.mode==="errs" ? `go({s:'errors',c:'${c.id}'})`
    : `go({s:'course',c:'${c.id}',tab:'train'})`;
  if(view.i>=view.items.length) return header(title,back)+`<div class="wrap">${exResult()}</div>`;
  const it=view.items[view.i];
  const dots=view.items.map((_,k)=>{
    const r=view.log[k];
    return `<i class="${r===true?"ok":r===false?"no":k===view.i?"cur":""}"></i>`;
  }).join("");
  if(it.t==="listen") setTimeout(()=>say(it.text,it.lang),450);
  return header(title,back)+`<div class="wrap"><div style="padding-top:20px">
    <div class="dots">${dots}</div>
    ${it.from?`<div class="qhint">${esc(it.from)}</div>`:""}
    <div id="qbox">${qBody(it)}</div>
  </div><div class="foot">${view.i+1} / ${view.items.length}</div></div>`;
}
function qBody(it){
  if(it.t==="choice"){
    return `<p class="q">${esc(it.q)}</p>${it.hint?`<p class="qhint">${esc(it.hint)}</p>`:""}
      <div id="opts">${it.o.map((o,k)=>`<button class="opt" onclick="answChoice(${k})">${esc(o)}</button>`).join("")}</div>
      <div id="fb"></div>`;
  }
  if(it.t==="gap"){
    return `<p class="q">${esc(it.q)}</p><p class="qhint">впишіть відповідь</p>
      <input type="text" id="ans" autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.key==='Enter')answGap()">
      <button class="btn" id="chk" onclick="answGap()">Перевірити</button><div id="fb"></div>`;
  }
  if(it.t==="tr"){
    return `<p class="q">${esc(it.q)}</p><p class="qhint">перекладіть</p>
      <textarea id="ans" style="min-height:90px"></textarea>
      <button class="btn" id="chk" onclick="answTr()">Показати відповідь</button><div id="fb"></div>`;
  }
  if(it.t==="listen"){
    return `<p class="q">Прослухайте й запишіть</p><p class="qhint">слухати можна скільки завгодно разів</p>
      <button class="spk big" data-s="${ea(it.text)}" onclick="say(this.dataset.s,'${it.lang}')" aria-label="Прослухати ще раз">♪</button>
      <div class="chiprow" id="rates" style="justify-content:center">
        <button class="chip" data-r="0.6" onclick="setRate(this)">повільно</button>
        <button class="chip on" data-r="0.9" onclick="setRate(this)">звично</button>
        <button class="chip" data-r="1.1" onclick="setRate(this)">швидко</button>
      </div>
      <input type="text" id="ans" autocomplete="off" autocapitalize="none" spellcheck="false" onkeydown="if(event.key==='Enter')answListen()">
      <button class="btn" id="chk" onclick="answListen()">Перевірити</button>
      <button class="btn ghost sm" id="chk2" onclick="answListen(true)">Не розчула — показати</button><div id="fb"></div>`;
  }
  if(it.t==="match"){
    const L=shuffle(it.pairs.map((p,k)=>({t:p[0],k}))), R=shuffle(it.pairs.map((p,k)=>({t:p[1],k})));
    matchState={sel:null,done:0,total:it.pairs.length,err:0};
    return `<p class="q">Складіть пари</p><p class="qhint">натисніть слово, потім його переклад</p>
      <div class="matchgrid">
        <div><div class="mhead">${view.c==="en"?"англійською":"іспанською"}</div>${L.map(x=>`<div class="mi" data-side="l" data-k="${x.k}" onclick="tapMatch(this)">${esc(x.t)}</div>`).join("")}</div>
        <div><div class="mhead">українською</div>${R.map(x=>`<div class="mi" data-side="r" data-k="${x.k}" onclick="tapMatch(this)">${esc(x.t)}</div>`).join("")}</div>
      </div><div id="fb"></div>`;
  }
  return "";
}
function fb(okFlag, html){
  document.getElementById("fb").innerHTML =
    `<div class="fb ${okFlag?"ok":"no"}"><b>${okFlag?"Правильно":"Не зовсім"}</b>${html}</div>
     <button class="btn" onclick="nextQ()">${view.i+1>=view.items.length?"Підсумок":"Далі"}</button>`;
  ["chk","chk2"].forEach(id=>{ const b=document.getElementById(id); if(b) b.classList.add("hidden"); });
}
function corrText(it){
  if(it.t==="choice") return it.o[it.a];
  if(it.t==="listen") return it.text;
  if(it.t==="match") return it.pairs.map(p=>p[0]+" — "+p[1]).join(" · ");
  return (it.a&&it.a[0])||"";
}
function errKey(it){ return (view.c||"")+"|"+(it.q||it.text||JSON.stringify(it.pairs||"")).slice(0,120); }
function lessonName(){
  if(view.mode==="lesson"){ const l=ALL.find(x=>x.id===view.id); return l?l.title:""; }
  if(view.mode==="text"){ const t=TEXTS.find(x=>x.id===view.textId); return t?"Текст: "+t.title:""; }
  return view.items[view.i].from||"Тренажер";
}
function logErr(it,your){
  const k=errKey(it);
  P.errs=P.errs.filter(e=>e.k!==k);
  P.errs.push({k, c:view.c, from:lessonName(), q:it.q||it.text||"Складання пар",
    your:(your||"").toString().slice(0,120), cor:corrText(it), why:it.why||"",
    date:today(), item:it, n:1});
  if(P.errs.length>300) P.errs=P.errs.slice(-300);
}
function clearErr(it){ const k=errKey(it); P.errs=P.errs.filter(e=>e.k!==k); }
function mark(okFlag, your){
  view.log[view.i]=okFlag;
  const it=view.items[view.i];
  if(okFlag){ view.ok++; addXp(10); clearErr(it); }
  else { logErr(it,your); touchDay(); }
  saveP();
}
function answChoice(k){
  const it=view.items[view.i]; if(view.log[view.i]!=null) return;
  const btns=[...document.querySelectorAll("#opts .opt")];
  btns.forEach((b,i)=>{ b.classList.add("dim"); if(i===it.a) b.classList.add("right"); });
  if(k!==it.a) btns[k].classList.add("wrong");
  btns[it.a].classList.remove("dim");
  mark(k===it.a, it.o[k]);
  fb(k===it.a, esc(it.why||""));
}
function answGap(){
  const it=view.items[view.i]; if(view.log[view.i]!=null) return;
  const v=document.getElementById("ans").value;
  const okFlag=it.a.some(a=>same(a,v));
  mark(okFlag,v);
  fb(okFlag, `<div class="cor">${esc(it.a[0])}</div>${esc(it.why||"")}`);
}
function answListen(reveal){
  const it=view.items[view.i]; if(view.log[view.i]!=null) return;
  const v=document.getElementById("ans").value;
  const okFlag = !reveal && same(it.text,v);
  mark(okFlag,v);
  fb(okFlag, `<div class="cor">${esc(it.text)}</div>${esc(it.why||"")}`);
}
function answTr(){
  const it=view.items[view.i]; if(view.log[view.i]!=null) return;
  const v=document.getElementById("ans").value;
  if(it.a.some(a=>same(a,v))){ mark(true); fb(true, `<div class="cor">${esc(it.a[0])}</div>${esc(it.why||"")}`); return; }
  document.getElementById("fb").innerHTML=`<div class="fb"><b>Зразок</b>
    <div class="cor">${it.a.map(a=>esc(a)).join("<br>")}</div>${esc(it.why||"")}</div>
    <p style="color:var(--dim);font-size:13.5px;margin:10px 0 0">Ваш варіант може відрізнятися й бути правильним. Оцініть себе самі.</p>
    <div class="row"><button class="btn" onclick="selfMark(true)">Зарахувати</button>
    <button class="btn ghost" onclick="selfMark(false)">Ще попрацюю</button></div>`;
  const b=document.getElementById("chk"); if(b) b.classList.add("hidden");
}
function selfMark(okFlag){ if(view.log[view.i]!=null) return; const el=document.getElementById("ans"); mark(okFlag, el?el.value:""); nextQ(); }
let matchState=null;
function tapMatch(el){
  if(el.classList.contains("gone")) return;
  const s=matchState;
  if(!s.sel){ document.querySelectorAll(".mi.sel").forEach(x=>x.classList.remove("sel")); el.classList.add("sel"); s.sel=el; return; }
  if(s.sel===el){ el.classList.remove("sel"); s.sel=null; return; }
  if(s.sel.dataset.side===el.dataset.side){ document.querySelectorAll(".mi.sel").forEach(x=>x.classList.remove("sel")); el.classList.add("sel"); s.sel=el; return; }
  if(s.sel.dataset.k===el.dataset.k){
    s.sel.classList.add("gone"); el.classList.add("gone"); s.sel.classList.remove("sel"); s.sel=null; s.done++;
    if(s.done===s.total){ mark(s.err===0, s.err?"з помилками":""); fb(s.err===0, s.err===0?"Усі пари складено без помилок.":"Складено з "+s.err+" помилками — варто повторити ці слова."); }
  }else{
    s.err++; el.classList.add("wrong"); s.sel.classList.remove("sel"); s.sel=null;
    setTimeout(()=>el.classList.remove("wrong"),400);
  }
}
function setRate(el){
  sRate=parseFloat(el.dataset.r);
  document.querySelectorAll("#rates .chip").forEach(x=>x.classList.toggle("on",x===el));
  const it=view.items[view.i]; if(it && it.text) say(it.text,it.lang);
}
function nextQ(){ view.i++; render(); window.scrollTo(0,0); }
function exResult(){
  const total=view.items.length, pct=Math.round(view.ok/total*100);
  let extra="";
  if(view.mode==="lesson"){
    const st=lp(view.id); st.rate=view.ok/total;
    if(pct>=70 && !st.done){
      st.done=true; addXp(50);
      const n=addLessonCards(view.id);
      if(n) extra=`<div class="card" style="text-align:center;color:var(--dim);font-size:14px">${n} нових слів пішли у ваші картки — перше повторення сьогодні.</div>`;
    }
    saveP();
  }
  const msg = pct>=90?"Тема засвоєна. Можна йти далі."
    : pct>=70?"Добре. Перегляньте пояснення там, де схибили."
    : "Варто повернутися до пояснення і пройти вправи ще раз.";
  const again = view.mode==="lesson"
    ? `<button class="btn" onclick="startLesson('${view.id}')">Пройти ще раз</button>
       <button class="btn ghost" onclick="go({s:'lesson',id:'${view.id}'})">До уроку</button>`
    : view.mode==="text"
    ? `<button class="btn" onclick="go({s:'text',c:'${view.c}',id:'${view.textId}',tr:false})">Повернутися до тексту</button>`
    : view.mode==="errs"
    ? `<button class="btn" onclick="go({s:'errors',c:'${view.c}'})">До журналу</button>`
    : `<button class="btn" onclick="go({s:'course',c:'${view.c}',tab:'train'})">До тренажера</button>`;
  return `<div class="result"><div class="big">${pct}%</div>
    <p>${view.ok} з ${total} · +${view.ok*10} XP</p></div>
    <div class="card" style="text-align:center">${esc(msg)}</div>${extra}${again}
    <div class="foot">&nbsp;</div>`;
}

/* ---------------- дрібниці ---------------- */
function toast(t){
  let el=document.getElementById("toast");
  if(!el){ el=document.createElement("div"); el.id="toast";
    el.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:88%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4);transition:opacity .3s";
    document.body.appendChild(el); }
  el.textContent=t; el.style.opacity="1";
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.opacity="0",2600);
}
function render(){
  if(!canSpeak) document.body.classList.add("nospeech");
  if(view.s==="home") app.innerHTML=screenHome();
  else if(view.s==="course") app.innerHTML=screenCourse();
  else if(view.s==="lesson") app.innerHTML=screenLesson();
  else if(view.s==="ex") app.innerHTML=screenEx();
  else if(view.s==="srs") app.innerHTML=screenSrs();
  else if(view.s==="errors") app.innerHTML=screenErrors();
  else if(view.s==="text") app.innerHTML=screenText();
}
function initRoute(){
  try{
    const g=new URLSearchParams(location.search).get("go");
    if(g==="en"||g==="es") view={s:"course",c:g,tab:"prog"};
    else if(g==="cards"){
      const c = dueCards("es").length > dueCards("en").length ? "es" : "en";
      view={s:"course",c,tab:"cards"};
    }
  }catch(e){}
}
loadP().then(()=>{ initRoute(); render(); });

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("./sw.js").catch(()=>{}); });
}

</script>
</body>
</html>
