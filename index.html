<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verba — англійська та іспанська</title>
<meta name="theme-color" content="#F3E9EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verba">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="application-name" content="Verba">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Verba — англійська від B1 та іспанська з нуля: уроки, граматика, слова, вправи, аудіювання, тексти й картки з повторенням.">
<style>
:root{
  --a1:#FFC46B; --a2:#FF6FA5; --a:#D2548A;
  --r:22px;
}
html[data-theme="light"]{
  --bg:#F3E9EC; --hi:#FBF4F6; --lo:#E8DBE0;
  --shd:rgba(178,148,159,.45); --shl:rgba(255,255,255,.95);
  --text:#4B3F46; --dim:#9C8B94; --line:rgba(150,120,132,.16);
  --ok:#3FA98A; --bad:#E2607A;
}
html[data-theme="dark"]{
  --bg:#252831; --hi:#2E323D; --lo:#1F222A;
  --shd:rgba(10,11,15,.65); --shl:rgba(255,255,255,.055);
  --text:#E9E6EE; --dim:#9A94A5; --line:rgba(255,255,255,.08);
  --ok:#5BD6A3; --bad:#FF7E8E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:'Onest',system-ui,sans-serif; font-size:16px; line-height:1.62;
  padding-bottom:env(safe-area-inset-bottom); overflow-x:hidden;
  transition:background .3s ease,color .3s ease;
}
.wrap{max-width:660px;margin:0 auto;padding:0 18px;position:relative;z-index:1}
h1,h2,h3,.disp{font-family:'Unbounded',sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1.16;margin:0}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:var(--a)}

/* ---------- морфізм ---------- */
.raised{background:linear-gradient(145deg,var(--hi),var(--lo));
  box-shadow:7px 7px 15px var(--shd), -7px -7px 15px var(--shl);}
.sunken{background:linear-gradient(145deg,var(--lo),var(--hi));
  box-shadow:inset 5px 5px 10px var(--shd), inset -5px -5px 10px var(--shl);}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:12px;height:66px}
.back,.tgl{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(145deg,var(--hi),var(--lo));
  box-shadow:5px 5px 10px var(--shd), -5px -5px 10px var(--shl);
  color:var(--dim);font-size:17px;transition:box-shadow .18s}
.back:active,.tgl:active{box-shadow:inset 4px 4px 8px var(--shd), inset -4px -4px 8px var(--shl)}
.top-title{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-family:'JetBrains Mono',monospace}
.xp{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--a);padding:7px 13px;border-radius:999px;
  background:linear-gradient(145deg,var(--lo),var(--hi));
  box-shadow:inset 3px 3px 6px var(--shd), inset -3px -3px 6px var(--shl);white-space:nowrap}

/* ---------- головна ---------- */
.hero{padding:24px 0 18px;text-align:center}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.hero h1{font-size:clamp(30px,9vw,40px);margin:12px 0 8px;
  background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--dim);margin:0 auto;font-size:14.5px;max-width:430px}
.goalring{display:flex;align-items:center;gap:18px;margin:22px 0;padding:18px;border-radius:26px;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:7px 7px 15px var(--shd), -7px -7px 15px var(--shl)}
.goalring .txt{flex:1}
.goalring b{display:block;font-family:'Unbounded',sans-serif;font-size:17px}
.goalring span{font-size:13px;color:var(--dim)}
.langs{display:grid;gap:16px;margin:6px 0 20px}
.lang{position:relative;overflow:hidden;text-align:left;width:100%;border-radius:26px;padding:20px;display:flex;gap:16px;align-items:center;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:7px 7px 15px var(--shd), -7px -7px 15px var(--shl);transition:box-shadow .18s}
.lang:active{box-shadow:inset 5px 5px 10px var(--shd), inset -5px -5px 10px var(--shl)}
.lang .info{flex:1;min-width:0}
.lang h2{font-size:21px;margin-bottom:3px}
.lang .sub{color:var(--dim);font-size:13.5px}
.lang .meta{margin-top:7px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim)}
.streak{display:flex;gap:12px;margin:0 0 22px}
.stat{flex:1;border-radius:20px;padding:14px 10px;text-align:center;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:6px 6px 12px var(--shd), -6px -6px 12px var(--shl)}
.stat b{display:block;font-family:'Unbounded',sans-serif;font-size:19px;
  background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:9.5px;color:var(--dim);font-family:'JetBrains Mono',monospace;letter-spacing:.1em}
.phrase{border-radius:24px;padding:20px;margin-bottom:20px;text-align:center;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:7px 7px 15px var(--shd), -7px -7px 15px var(--shl)}
.phrase .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.phrase .pf{font-size:18px;font-weight:600;margin:10px 0 4px;line-height:1.4}
.phrase .pt{color:var(--dim);font-size:14px}

/* ---------- вкладки ---------- */
.tabs{position:sticky;top:66px;z-index:15;background:var(--bg);padding:2px 0 10px}
.tabs .wrap{display:flex;gap:6px;padding:6px;border-radius:20px;
  background:linear-gradient(145deg,var(--lo),var(--hi));box-shadow:inset 4px 4px 9px var(--shd), inset -4px -4px 9px var(--shl)}
.tab{flex:1;padding:9px 3px;border-radius:15px;font-size:12.5px;font-weight:600;color:var(--dim);text-align:center;transition:.2s}
.tab.on{color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:3px 3px 8px var(--shd)}

/* ---------- уроки ---------- */
.levelhead{display:flex;align-items:center;gap:10px;margin:26px 0 14px}
.levelhead .lv{font-family:'Unbounded',sans-serif;font-size:12px;color:#fff;border-radius:11px;padding:4px 12px;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:3px 3px 8px var(--shd)}
.levelhead .lvd{font-size:12.5px;color:var(--dim)}
.lesson{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border-radius:22px;padding:15px;margin-bottom:13px;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:6px 6px 13px var(--shd), -6px -6px 13px var(--shl);transition:box-shadow .18s}
.lesson:active{box-shadow:inset 5px 5px 10px var(--shd), inset -5px -5px 10px var(--shl)}
.lesson.locked{opacity:.5}
.lesson .n{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-size:15px;color:var(--dim);
  background:linear-gradient(145deg,var(--lo),var(--hi));box-shadow:inset 3px 3px 6px var(--shd), inset -3px -3px 6px var(--shl)}
.lesson.done .n{color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:3px 3px 8px var(--shd)}
.lesson h3{font-size:15.5px;margin-bottom:3px;font-family:'Onest',sans-serif;font-weight:600;letter-spacing:0}
.lesson p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.45}
.lesson .l{flex:1;min-width:0}
.lesson .tick{margin-left:auto;color:var(--dim);font-size:14px;flex:0 0 auto}

/* ---------- урок ---------- */
.lhero{padding:14px 0 6px;text-align:center}
.lhero .num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--a);letter-spacing:.16em}
.lhero h1{font-size:clamp(22px,6.5vw,29px);margin:10px 0 14px}
.goal{border-radius:20px;padding:15px 17px;font-size:14.5px;color:var(--dim);text-align:left;
  background:linear-gradient(145deg,var(--lo),var(--hi));box-shadow:inset 4px 4px 9px var(--shd), inset -4px -4px 9px var(--shl)}
.sec{margin:30px 0}
.sectitle{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.sectitle span{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.sectitle i{flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--a1),transparent)}
.card{border-radius:var(--r);padding:18px;margin-bottom:14px;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:7px 7px 15px var(--shd), -7px -7px 15px var(--shl)}
.tx p{margin:0 0 14px;font-size:15.5px}
.tx h4{font-family:'Onest',sans-serif;font-size:15.5px;font-weight:700;margin:22px 0 9px;color:var(--a)}
.tx ul{margin:0 0 14px;padding-left:18px}
.tx li{margin-bottom:7px;font-size:15px}
code,.k{font-family:'JetBrains Mono',monospace;font-size:.86em;border-radius:7px;padding:2px 7px;color:var(--a);
  background:linear-gradient(145deg,var(--lo),var(--hi));box-shadow:inset 2px 2px 4px var(--shd), inset -2px -2px 4px var(--shl)}
.slab{border-radius:20px;padding:17px;margin:0 0 16px;overflow-x:auto;
  background:linear-gradient(145deg,var(--lo),var(--hi));box-shadow:inset 4px 4px 9px var(--shd), inset -4px -4px 9px var(--shl)}
.slab .formula{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;letter-spacing:.01em;white-space:nowrap;line-height:1.85}
.slab table{border-collapse:collapse;width:100%;font-family:'JetBrains Mono',monospace;font-size:13px}
.slab th{text-align:left;font-weight:500;color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:0 12px 9px 0;white-space:nowrap}
.slab td{padding:7px 12px 7px 0;border-top:1px solid var(--line);white-space:nowrap;vertical-align:top}
.m{font-weight:700;background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ex{margin:0 0 14px;padding:0;list-style:none}
.ex li{padding:11px 0;border-top:1px solid var(--line)}
.ex li:first-child{border-top:0}
.ex b{display:block;font-weight:600;font-size:15px}
.ex span{display:block;color:var(--dim);font-size:13.5px;margin-top:2px}
.warn{border-radius:20px;padding:14px 16px;font-size:14.5px;margin:0 0 16px;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:5px 5px 11px var(--shd), -5px -5px 11px var(--shl);
  border-left:4px solid var(--bad)}
.warn b{color:var(--bad);display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin-bottom:5px}
.word{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line);align-items:flex-start}
.word:first-child{border-top:0}
.word .l,.crow .l{flex:1;min-width:0}
/* рядок картки: теги зверху, текст на всю ширину */
.crow{padding:15px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.ctop{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.ctop .cact{margin-left:auto;display:flex;gap:7px}
.box.own{color:var(--dim)}
.cbody{display:flex;gap:12px;align-items:flex-start}
.crow .cs{color:var(--dim);font-size:12.5px;font-style:italic;margin-top:3px;line-height:1.5}
.crow .cw{line-height:1.4}
.word .w,.crow .cw{font-weight:600;font-size:15.5px}
/* збери речення */
.built{min-height:78px;border-radius:20px;padding:12px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;
  background:linear-gradient(145deg,var(--lo),var(--hi));box-shadow:inset 4px 4px 9px var(--shd), inset -4px -4px 9px var(--shl)}
.tokhint{color:var(--dim);font-size:13px;font-family:'JetBrains Mono',monospace;align-self:center;margin:auto}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.tok{border-radius:14px;padding:10px 14px;font-size:15px;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:4px 4px 9px var(--shd), -4px -4px 9px var(--shl);transition:.14s}
.tok:active{box-shadow:inset 3px 3px 7px var(--shd), inset -3px -3px 7px var(--shl)}
.tok.on{color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:3px 3px 8px var(--shd)}
.word .tr,.crow .ct{font-size:14px;font-weight:600;
  background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.word .s{color:var(--dim);font-size:13px;font-style:italic;margin-top:3px}
.pat{padding:13px 0;border-top:1px solid var(--line)}
.pat:first-child{border-top:0}
.pat .f{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700;
  background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pat .t{font-size:14px;margin-top:3px}
.pat .s{font-size:13px;color:var(--dim);font-style:italic;margin-top:2px}

/* ---------- елементи керування ---------- */
.btn{display:block;width:100%;border-radius:20px;padding:15px;margin-top:14px;text-align:center;font-size:15.5px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));
  box-shadow:6px 6px 14px var(--shd), -5px -5px 12px var(--shl);transition:box-shadow .16s,transform .16s}
.btn:active{transform:translateY(1px);box-shadow:2px 2px 7px var(--shd)}
.btn.ghost{color:var(--dim);background:linear-gradient(145deg,var(--hi),var(--lo));font-weight:600}
.btn.sm{padding:11px;font-size:13.5px;border-radius:16px}
.row{display:flex;gap:12px}
.row>*{flex:1}
input[type=text],textarea{
  width:100%;border:0;border-radius:18px;padding:14px 17px;color:var(--text);font-family:'Onest',sans-serif;font-size:16px;outline:none;
  background:linear-gradient(145deg,var(--lo),var(--hi));box-shadow:inset 4px 4px 9px var(--shd), inset -4px -4px 9px var(--shl)}
textarea{min-height:130px;line-height:1.6;resize:vertical}
.dots{display:flex;gap:6px;margin-bottom:18px;padding:7px;border-radius:14px;
  background:linear-gradient(145deg,var(--lo),var(--hi));box-shadow:inset 3px 3px 7px var(--shd), inset -3px -3px 7px var(--shl)}
.dots i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--bad)}
.dots i.cur{background:linear-gradient(90deg,var(--a1),var(--a2))}
.q{font-size:18px;font-weight:600;margin:0 0 7px;line-height:1.45}
.qhint{color:var(--dim);font-size:12.5px;margin:0 0 18px;font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.opt{display:block;width:100%;text-align:left;border-radius:19px;padding:15px 17px;margin-bottom:11px;font-size:15.5px;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:5px 5px 12px var(--shd), -5px -5px 12px var(--shl);transition:.15s}
.opt:active{box-shadow:inset 4px 4px 9px var(--shd), inset -4px -4px 9px var(--shl)}
.opt.right{box-shadow:inset 4px 4px 9px var(--shd), inset -4px -4px 9px var(--shl);border-left:4px solid var(--ok)}
.opt.wrong{box-shadow:inset 4px 4px 9px var(--shd), inset -4px -4px 9px var(--shl);border-left:4px solid var(--bad)}
.opt.dim{opacity:.45}
.fb{border-radius:20px;padding:15px 17px;margin-top:14px;font-size:14.5px;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:5px 5px 12px var(--shd), -5px -5px 12px var(--shl);border-left:4px solid var(--dim)}
.fb.ok{border-left-color:var(--ok)} .fb.no{border-left-color:var(--bad)}
.fb b{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--bad)}
.fb .cor{font-weight:700;margin-bottom:4px;
  background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.mhead{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  text-align:center;margin-bottom:9px}
.mi{border-radius:17px;padding:13px 10px;font-size:14px;text-align:center;min-height:54px;display:grid;place-items:center;
  margin-bottom:11px;transition:.15s}
.mi[data-side="l"]{font-weight:600;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:5px 5px 11px var(--shd), -5px -5px 11px var(--shl)}
.mi[data-side="r"]{color:var(--dim);
  background:linear-gradient(145deg,var(--lo),var(--hi));box-shadow:inset 4px 4px 9px var(--shd), inset -4px -4px 9px var(--shl)}
.mi.sel,.mi[data-side="r"].sel{color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));
  box-shadow:5px 5px 12px var(--shd)}
.mi.wrong{box-shadow:inset 4px 4px 9px var(--shd), inset -4px -4px 9px var(--shl);color:var(--bad)}
.mi.gone{opacity:.2;pointer-events:none}
.result{text-align:center;padding:26px 0 10px}
.result .big{font-family:'Unbounded',sans-serif;font-size:52px;line-height:1;
  background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.result p{color:var(--dim);margin:12px 0 0;font-size:14px}

/* ---------- база ---------- */
.search{position:relative;margin:8px 0 16px}
.search input{padding-left:44px}
.search:before{content:"⌕";position:absolute;left:18px;top:12px;color:var(--dim);font-size:19px;z-index:2}
.chiprow{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 8px;margin-bottom:14px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:999px;padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--dim);
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:4px 4px 9px var(--shd), -4px -4px 9px var(--shl)}
.chip.on{color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.acc{border-radius:22px;margin-bottom:12px;overflow:hidden;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:6px 6px 13px var(--shd), -6px -6px 13px var(--shl)}
.acc>button{display:flex;width:100%;text-align:left;gap:11px;padding:16px;align-items:center}
.acc h3{font-family:'Onest',sans-serif;font-size:15px;font-weight:600;letter-spacing:0;flex:1}
.acc .lvtag,.box{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--a);border-radius:8px;padding:3px 8px;height:fit-content;
  background:linear-gradient(145deg,var(--lo),var(--hi));box-shadow:inset 2px 2px 4px var(--shd), inset -2px -2px 4px var(--shl)}
.acc .body{padding:0 16px 16px;display:none}
.acc.open .body{display:block}
.empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:14.5px}

/* ---------- звук ---------- */
.spk{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--a);font-size:13px;flex:0 0 auto;vertical-align:middle;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:4px 4px 8px var(--shd), -4px -4px 8px var(--shl);transition:.15s}
.spk:active{box-shadow:inset 3px 3px 7px var(--shd), inset -3px -3px 7px var(--shl)}
.spk.big{width:96px;height:96px;font-size:34px;color:#fff;margin:10px auto 22px;display:flex;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:8px 8px 20px var(--shd), -6px -6px 16px var(--shl)}
.nospeech .spk{display:none}


/* ---------- озвучення з підписом ---------- */
.spkrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:2px 0 4px}
.spkpill{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--a);
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:4px 4px 9px var(--shd), -4px -4px 9px var(--shl);transition:.15s}
.spkpill:active{box-shadow:inset 3px 3px 7px var(--shd), inset -3px -3px 7px var(--shl)}
/* ---------- шкала етапів картки ---------- */
.stagebar{display:flex;align-items:center;gap:5px;margin:14px 0 16px;padding:9px 14px;border-radius:16px;
  background:linear-gradient(145deg,var(--lo),var(--hi));box-shadow:inset 3px 3px 7px var(--shd), inset -3px -3px 7px var(--shl)}
.stagebar i{width:16px;height:5px;border-radius:5px;background:var(--line)}
.stagebar i.on{background:var(--a)}
.stagebar i.cur{background:linear-gradient(90deg,var(--a1),var(--a2));width:26px}
.stagebar span{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
/* ---------- картки ---------- */
.cstat{display:flex;gap:12px;margin:8px 0 16px}
.cstat div{flex:1;border-radius:20px;padding:14px 8px;text-align:center;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:6px 6px 12px var(--shd), -6px -6px 12px var(--shl)}
.cstat b{display:block;font-family:'Unbounded',sans-serif;font-size:19px;
  background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.cstat span{font-size:9.5px;color:var(--dim);font-family:'JetBrains Mono',monospace;letter-spacing:.08em}
.face{border-radius:30px;padding:34px 22px;text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:12px;margin-bottom:16px;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:9px 9px 20px var(--shd), -9px -9px 20px var(--shl)}
.face .fw{font-family:'Unbounded',sans-serif;font-size:25px;line-height:1.25;word-break:break-word}
.face .ft{font-size:19px;font-weight:700;
  background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.face .fs{color:var(--dim);font-size:14.5px;font-style:italic}
.face .tip{color:var(--dim);font-size:11.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em}
.del{color:var(--dim);font-size:17px;width:34px;height:34px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(145deg,var(--hi),var(--lo));box-shadow:3px 3px 7px var(--shd), -3px -3px 7px var(--shl)}
.del:active{box-shadow:inset 3px 3px 6px var(--shd);color:var(--bad)}
.form label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}

/* ---------- інше ---------- */
.hidden{display:none!important}
.foot{padding:26px 0 44px;color:var(--dim);font-size:11.5px;text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:.08em}
.saved{color:var(--ok);font-size:13px;text-align:center;margin-top:10px;font-family:'JetBrains Mono',monospace}
.hw{font-size:15px}

/* ---------- читання ---------- */
.tpar{padding:14px 0;border-top:1px solid var(--line)}
.tpar:first-child{border-top:0}
.ptxt{font-size:16.5px;line-height:1.75}
.prow{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
.ptr{flex:1;color:var(--dim);font-size:13.5px;line-height:1.55;padding-top:6px}
.gl{border-bottom:2px dotted var(--a);cursor:pointer;padding-bottom:1px}
.hg{font-weight:700;border-radius:6px;padding:1px 4px;
  background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* ---------- журнал помилок ---------- */
.errrow{padding:15px 0;border-top:1px solid var(--line);position:relative}
.errrow:first-child{border-top:0}
.errrow .del{position:absolute;right:0;top:12px}
.ehead{display:flex;gap:10px;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:7px;padding-right:40px}
.eq{font-size:15px;font-weight:600;margin-bottom:6px;padding-right:40px}
.ey{font-size:13.5px;color:var(--bad);margin-bottom:2px}
.ec{font-size:14.5px;font-weight:700;
  background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ew{font-size:13px;color:var(--dim);margin-top:5px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
</style>
</head>

<script>
const EN_LESSONS = [
{
id:"en1", level:"B1", num:1,
title:"Present Perfect vs Past Simple",
short:"Два минулих, які плутають найчастіше",
goal:"Навчитися відчувати різницю: Past Simple розповідає про завершений епізод у минулому, Present Perfect говорить про минуле заради теперішнього.",
theory:[
 {h:"Головна ідея"},
 {p:"Обидва часи описують дію, якої вже немає. Різниця не в тому, коли вона сталася, а в тому, **куди дивиться речення**. Past Simple дивиться назад — у закритий відрізок часу. Present Perfect дивиться на зараз — на результат, досвід, зміну стану."},
 {slab:"V2 / V-ed          →  Past Simple\nhave / has + V3     →  Present Perfect"},
 {p:"Порівняйте дві репліки про ту саму ситуацію:"},
 {ex:[
  ["I lost my keys yesterday.","Учора я загубила ключі. — епізод у закритому «вчора», зараз вони, може, вже знайшлися."],
  ["I have lost my keys.","Я загубила ключі. — і ось зараз я без ключів. Важливий не момент, а наслідок."]
 ]},
 {h:"Коли обов’язково Present Perfect"},
 {list:[
  "**Досвід життя** — чи було це взагалі, без дати: I have never tried surfing.",
  "**Результат, який видно зараз**: She has broken her arm (рука досі в гіпсі).",
  "**Дія триває до цього моменту** з for / since: We have known each other for ten years.",
  "**Щойно / вже / ще ні** — just, already, yet: I have just finished. Have you eaten yet?",
  "**Незакінчений період**: today, this week, this year — this month I have read three books."
 ]},
 {h:"Коли обов’язково Past Simple"},
 {p:"Щойно в реченні з’являється **закритий час** — ago, yesterday, last week, in 2019, when I was a child, at 5 o’clock — Present Perfect неможливий. Період закрився, отже дія відрізана від теперішнього."},
 {tbl:{head:["Present Perfect","Past Simple"],rows:[
  ["I have ~just~ arrived.","I arrived ~an hour ago~."],
  ["Have you ~ever~ been to Spain?","~When~ did you go to Spain?"],
  ["He has lived here ~since~ 2019.","He lived here ~from 2019 to 2022~."],
  ["This week I have written two texts.","~Last~ week I wrote two texts."]
 ]}},
 {warn:"Типова помилка українців: «Я вже подзвонила йому вчора» → I have already called him yesterday ✗. Правильно: I already called him yesterday ✓ або I have already called him ✓ (без «вчора»)."},
 {h:"Питання про досвід і продовження"},
 {p:"Розмова часто йде за схемою: перше питання в Present Perfect (чи було взагалі), а далі — деталі в Past Simple."},
 {ex:[
  ["— Have you seen the new film? — Yes, I have. I watched it on Friday and loved it.","— Ти бачила новий фільм? — Так. Я дивилася його в п’ятницю, і він мені сподобався."],
  ["— Has she ever worked abroad? — She worked in Poland for two years.","— Вона колись працювала за кордоном? — Вона два роки працювала в Польщі."]
 ]},
 {h:"been чи gone"},
 {p:"He has **gone** to London — поїхав і ще там. He has **been** to London — був і вже повернувся. Ця пара живе тільки в Present Perfect."}
],
words:[
 {w:"to come up with",t:"вигадати, придумати (ідею)",s:"She came up with a brilliant name for the club."},
 {w:"to get the hang of",t:"призвичаїтися, вловити суть",s:"I have finally got the hang of this app."},
 {w:"barely",t:"ледве, майже не",s:"We have barely spoken since March."},
 {w:"a turning point",t:"переломний момент",s:"That trip was a turning point in my life."},
 {w:"to look into",t:"розібратися в, вивчити питання",s:"I have looked into it and found the answer."},
 {w:"so far",t:"поки що, досі",s:"So far everything has gone well."},
 {w:"to run out of",t:"вичерпати запас чогось",s:"We have run out of coffee again."},
 {w:"overwhelming",t:"приголомшливий, надмірний",s:"The response has been overwhelming."},
 {w:"to end up",t:"опинитися в підсумку",s:"We ended up staying at home."},
 {w:"a breakthrough",t:"прорив",s:"There has been a real breakthrough in the project."},
 {w:"to keep track of",t:"стежити за, вести облік",s:"I keep track of every book I read."},
 {w:"ever since",t:"відтоді й донині",s:"We have been friends ever since."}
],
pats:[
 {f:"It’s the first time I have ever + V3",t:"Це вперше, коли я…",s:"It’s the first time I have ever cooked paella."},
 {f:"I have been meaning to + V1",t:"Я давно збиралася щось зробити",s:"I have been meaning to call you all week."},
 {f:"How long have you + V3 …?",t:"Як давно ти…?",s:"How long have you known her?"},
 {f:"That was the best … I have ever + V3",t:"Це найкраще, що я коли-небудь…",s:"That was the best coffee I have ever had."},
 {f:"I haven’t + V3 … yet",t:"Я ще не…",s:"I haven’t decided yet."}
],
ex:[
 {t:"choice",q:"I ___ to Barcelona three times, and I want to go again.",o:["went","have been","have gone","was"],a:1,why:"Досвід життя без конкретної дати — Present Perfect. «Have been» = була і повернулася."},
 {t:"choice",q:"She ___ her phone yesterday, so she can’t call you.",o:["has lost","lost","loses","had lost"],a:1,why:"«Yesterday» — закритий час, тому тільки Past Simple, попри те що результат відчутний зараз."},
 {t:"gap",q:"— Where is Tom? — He ___ (go) to the bank, he’ll be back soon.",a:["has gone","'s gone","has gone to the bank"],why:"Has gone — пішов і ще там. Has been означало б, що вже повернувся."},
 {t:"gap",q:"We ___ (know) each other since university.",a:["have known","'ve known"],why:"Since + дія триває донині → Present Perfect. Know — стан, тому не Continuous."},
 {t:"choice",q:"Яке речення правильне?",o:["I have finished my homework two hours ago.","I finished my homework two hours ago.","I have finished my homework two hours before.","I finish my homework two hours ago."],a:1,why:"Ago завжди тягне за собою Past Simple."},
 {t:"gap",q:"This month I ___ (read) three books — more than in the whole spring.",a:["have read","'ve read"],why:"«This month» ще не закінчився → період відкритий → Present Perfect."},
 {t:"tr",q:"Я ще не бачила цей фільм, але подруга дивилася його минулого тижня.",a:["I haven't seen this film yet, but my friend watched it last week.","I haven't seen this movie yet but my friend saw it last week."],why:"Перша частина — досвід без дати (Present Perfect), друга — «last week» (Past Simple)."},
 {t:"tr",q:"Як давно ти працюєш над цим проєктом?",a:["How long have you worked on this project?","How long have you been working on this project?"],why:"Питання про тривалість до цього моменту — Present Perfect (або Continuous, урок 2)."},
 {t:"match",pairs:[["so far","поки що"],["to run out of","вичерпати запас"],["a turning point","переломний момент"],["barely","ледве"]]}
],
hw:"Напишіть 8–10 речень про свій рік: 4 у Present Perfect (що вже сталося, що змінилося, чого ще не встигли) і 4 у Past Simple (конкретні епізоди з датою). Підкресліть маркери часу, які змусили вас вибрати саме цей час."
},

{
id:"en2", level:"B1", num:2,
title:"Present Perfect Continuous",
short:"Процес, який триває і видно його сліди",
goal:"Розрізняти «скільки вже роблю» (Continuous) і «скільки вже зробила» (Perfect), а також бачити, коли доречні обидва.",
theory:[
 {slab:"have / has + been + V-ing"},
 {p:"Present Perfect Continuous підкреслює **тривалість або сам процес**, який почався в минулому і або триває зараз, або щойно закінчився і залишив помітний слід."},
 {ex:[
  ["I have been learning Spanish for two months.","Я вчу іспанську вже два місяці — процес триває."],
  ["Your eyes are red. Have you been crying?","У тебе червоні очі. Ти плакала? — процес щойно закінчився, наслідок видно."],
  ["It has been raining all morning.","Дощ ішов увесь ранок."]
 ]},
 {h:"Continuous чи простий Perfect"},
 {tbl:{head:["Present Perfect Continuous","Present Perfect"],rows:[
  ["акцент на ~процесі~","акцент на ~результаті~"],
  ["I have been reading this book.","I have read this book."],
  ["(читаю, ще не дочитала)","(прочитала, є результат)"],
  ["I have been writing emails all day.","I have written ~five~ emails."],
  ["без чисел","із числом: скільки саме зроблено"]
 ]}},
 {p:"Правило-підказка: **якщо ви називаєте кількість** (three letters, twice, half of it) — потрібен простий Present Perfect. Кількість = результат."},
 {h:"Дієслова стану"},
 {p:"Дієслова стану — know, be, have (мати), love, believe, understand, need, want, seem, belong — у Continuous не ставлять. Кажемо I have known her for years, а не I have been knowing."},
 {warn:"Не плутайте з Present Continuous: «I am learning Spanish for two months» ✗. Якщо є for / since — потрібен перфект: I have been learning Spanish for two months ✓."},
 {h:"for і since"},
 {slab:"for + ~тривалість~   →  for three hours, for ages, for a week\nsince + ~точка~      →  since Monday, since 2019, since I moved"},
 {ex:[
  ["She has been working here since March.","Вона працює тут із березня."],
  ["They have been arguing for half an hour.","Вони сваряться вже пів години."]
 ]},
 {h:"Роздратування і повторюваність"},
 {p:"Present Perfect Continuous часто несе емоцію: скаргу, докір, здивування від того, що щось надто довго триває."},
 {ex:[
  ["I have been waiting for you for forty minutes!","Я чекаю на тебе вже сорок хвилин!"],
  ["He has been calling me every day this week.","Він телефонує мені щодня цього тижня."]
 ]}
],
words:[

 {w:"non-stop",t:"без упину",s:"She has been talking non-stop."},
 {w:"exhausted",t:"виснажений",s:"I'm exhausted — I have been cleaning all day."},
 {w:"to put off",t:"відкладати на потім",s:"I have been putting off this call for weeks."},
 {w:"to catch up on",t:"надолужити",s:"I need to catch up on sleep."},
 {w:"gradually",t:"поступово",s:"Things have been gradually getting better."},
 {w:"to struggle with",t:"мати труднощі з",s:"I have been struggling with the grammar."},
 {w:"lately",t:"останнім часом",s:"Have you been sleeping well lately?"},
 {w:"on and off",t:"з перервами, час від часу",s:"I have been studying Spanish on and off."},
 {w:"to make progress",t:"робити поступ",s:"You have been making great progress."},
 {w:"a while",t:"деякий час",s:"We haven't spoken for a while."},
 {w:"to keep + V-ing",t:"постійно щось робити",s:"He keeps interrupting me."}
],
pats:[
 {f:"I have been trying to + V1",t:"Я вже намагаюся…",s:"I have been trying to reach you all day."},
 {f:"How long have you been + V-ing?",t:"Як давно ти цим займаєшся?",s:"How long have you been playing the guitar?"},
 {f:"I have been + V-ing … ever since",t:"Я роблю це відтоді й досі",s:"I have been going there ever since."},
 {f:"What have you been up to?",t:"Що поробляла останнім часом?",s:"Hi! What have you been up to?"}
],
ex:[
 {t:"choice",q:"I ___ this book — I'm on page 200 of 300.",o:["have read","have been reading","read","am reading"],a:1,why:"Процес не закінчено, акцент на тривалості."},

 {t:"gap",q:"She ___ (work) here since 2021.",a:["has been working","has worked","'s been working"],why:"Обидва варіанти прийнятні: із дієсловами роботи/життя різниця стирається."},
 {t:"gap",q:"Sorry I'm late — I ___ (wait) for the bus for half an hour.",a:["have been waiting","'ve been waiting"],why:"Тривалий процес із for + емоція → Perfect Continuous."},
 {t:"choice",q:"Яке речення НЕправильне?",o:["I have been knowing him for years.","I have known him for years.","I have been thinking about it.","I have thought about it a lot."],a:0,why:"Know — дієслово стану, у Continuous не вживається."},

{
id:"en3", level:"B1", num:3,
title:"Past Perfect і час у розповіді",
short:"Як позначити «ще раніше, ніж минуле»",

theory:[
 {slab:"had + V3  →  дія, що сталася РАНІШЕ за іншу минулу дію"},
 {p:"Past Perfect не вживають самотньо. Він завжди існує у зв’язці з іншою минулою точкою — прямо названою або зрозумілою з контексту."},
 {ex:[
  ["When I arrived, the meeting had already started.","Коли я прийшла, зустріч уже почалася. — спочатку почалася, потім я прийшла."],
  ["When I arrived, the meeting started.","Коли я прийшла, зустріч почалася. — я прийшла, і одразу почалося."]
 ]},
 {h:"Три шари розповіді"},
 {tbl:{head:["Шар","Час","Приклад"],rows:[
  ["фон, обстановка","Past Continuous","It ~was raining~ and everyone was tired"],
  ["ланцюг подій","Past Simple","she ~opened~ the door and ~saw~ him"],
  ["передісторія","Past Perfect","he ~had waited~ there for an hour"]
 ]}},
 {p:"Разом це звучить так: **It was raining when she opened the door and saw him — he had been waiting there for an hour.**"},
 {h:"Типові супутники"},
 {list:[
  "**already, just, never, yet** — I had never seen anything like it.",
  "**by the time / by 2020** — By the time we got there, they had left.",
  "**after / before** — After she had finished, she went home.",
  "**It was the first time …** — It was the first time I had flown alone."
 ]},

{
id:"es18", level:"B1",
title:"Imperfecto de subjuntivo і умовні речення",

theory:[
 {p:"Imperfecto de subjuntivo утворюють **від форми ellos в indefinido**: відкидають -ron і додають закінчення. Це працює для всіх дієслів без винятку, включно з найнеправильнішими."},
 {slab:"ellos hablaron → habla~ron~ → habla~ra~\nellos comieron → comie~ron~ → comie~ra~\nellos tuvieron → tuvie~ron~ → tuvie~ra~\nellos fueron   → fue~ron~   → fue~ra~"},
 {tbl:{head:["","hablar","tener","ser / ir"],rows:[
  ["yo","habla~ra~","tuvie~ra~","fue~ra~"],
  ["tú","habla~ras~","tuvie~ras~","fue~ras~"],
  ["él/ella","habla~ra~","tuvie~ra~","fue~ra~"],
  ["nosotros","hablá~ramos~","tuvié~ramos~","fué~ramos~"],
  ["ellos","habla~ran~","tuvie~ran~","fue~ran~"]
 ]}},
 {p:"Існує друга, рівноправна форма на **-se**: hablase, tuviese, fuese. В Іспанії вона частіша на письмі, у Латинській Америці майже не вживається. Значення однакове."},
 {h:"1. Умовні речення другого типу"},
 {slab:"Si + imperfecto de subjuntivo , condicional"},
 {ex:[
  ["Si tuviera más tiempo, aprendería a tocar el piano.","Якби я мала більше часу, навчилася б грати на піаніно."],
  ["Si pudiera, me mudaría al mar.","Якби могла, переїхала б до моря."],
  ["Si fuera rica, viajaría todo el año.","Якби я була багата, подорожувала б цілий рік."],
  ["Si supieras la verdad, no dirías eso.","Якби ти знала правду, ти б такого не казала."],
  ["¿Qué harías si te tocara la lotería?","Що б ти зробила, якби виграла в лотерею?"]
 ]},
 {warn:"Після si ніколи не буває presente de subjuntivo. Тільки indicativo (реальна умова: si tengo tiempo) або imperfecto de subjuntivo (уявна: si tuviera tiempo)."},
 {h:"2. Ojalá"},
 {p:"**Ojalá + presente de subjuntivo** — реальне сподівання. **Ojalá + imperfecto de subjuntivo** — мрія, у здійснення якої не дуже віриться."},
 {ex:[
  ["Ojalá venga mañana.","Хоч би він прийшов завтра. — цілком можливо"],
  ["Ojalá viniera mañana.","От якби ж він прийшов завтра. — навряд чи"],
  ["Ojalá tuviera veinte años otra vez.","От якби мені знову було двадцять."]
 ]},
 {h:"3. Узгодження часів"},
 {p:"Якщо головне речення стоїть у минулому чи в condicional, підрядне переходить в imperfecto de subjuntivo."},
 {tbl:{head:["Головне речення","Підрядне","Приклад"],rows:[
  ["теперішнє","~presente~ de subj.","quiero que ~vengas~"],
  ["минуле","~imperfecto~ de subj.","quería que ~vinieras~"],
  ["condicional","~imperfecto~ de subj.","me gustaría que ~vinieras~"]
 ]}},
 {ex:[
  ["Me pidió que le ayudara.","Він попросив, щоб я йому допомогла."],
  ["No creía que fuera tan difícil.","Я не думала, що це так складно."],
  ["Me gustaría que vinieras conmigo.","Мені б хотілося, щоб ти пішла зі мною."],
  ["Era importante que estuviéramos juntos.","Було важливо, щоб ми були разом."]
 ]},
 {h:"4. Como si"},
 {p:"Після **como si** («ніби») завжди стоїть imperfecto de subjuntivo — незалежно від часу головної частини."},
 {ex:[
  ["Habla como si lo supiera todo.","Він говорить так, ніби все знає."],
  ["Me miró como si no me conociera.","Він подивився на мене так, ніби не знав мене."]
 ]},
 {h:"5. Ввічливість"},
 {p:"Форма **quisiera** — найм’якший спосіб щось попросити: Quisiera reservar una mesa. Звучить ввічливіше за quiero й навіть за me gustaría."}
],

 "Люди часто питають, чи повторила б я це. Чесно кажучи, я вже робила це тричі, і щоразу дізнавалася щось нове про те, куди йде моя увага."

id:"tx-en2", c:"en", level:"B1", title:"The night the lights went out",
sub:"Минулі часи в розповіді",
par:[
 "It **was raining** hard when the power **went** out. I **was cooking** dinner and my neighbour Marta **was telling** me about her new job, so at first neither of us **noticed**.",
 "Then the fridge **stopped** humming and the whole street **went** dark. Marta **had left** her keys inside her flat that morning, so she couldn't go home and get a torch.",
 "We **lit** three candles, put them on the windowsill and finished cooking almost blind. The pasta **was** terrible. We **ate** it anyway.",
 "By eleven the storm **had passed**, but the power **hadn't come** back. We **sat** on the floor with a blanket and told each other stories we **had never told** anyone.",
 "The lights **came** on at two in the morning. Marta looked at me and said the strangest thing: she **had been hoping** the blackout would last a little longer."
],
tr:[
 "Лив дощ, коли зникло світло. Я готувала вечерю, а моя сусідка Марта розповідала про свою нову роботу, тож спершу ми обидві нічого не помітили.",
 "Потім холодильник перестав гудіти, і вся вулиця потонула в темряві. Того ранку Марта залишила ключі в квартирі, тож не могла піти додому по ліхтарик.",
 "Ми запалили три свічки, поставили їх на підвіконня й дотягнули вечерю майже наосліп. Паста вийшла жахлива. Ми все одно її з'їли.",
 "До одинадцятої гроза минула, але світла так і не було. Ми сиділи на підлозі під ковдрою й розповідали одна одній історії, яких не розповідали нікому.",
 "Світло ввімкнулося о другій ночі. Марта подивилася на мене й сказала дивну річ: вона сподівалася, що темрява протримається ще трохи."
],

{
id:"tx-en3", c:"en", level:"B2", title:"What your morning says about you",
sub:"Пасив і непряма мова",
par:[
 "Morning routines **are discussed** online more than almost any other habit. We **are told** that successful people wake at five, that cold showers **are recommended** by every second podcast, and that a day **is won or lost** before eight.",
 "A study **was carried out** last year at a Swedish university. Four hundred people **were asked** to describe their mornings, and their sleep **was measured** for six weeks.",
 "The researchers **said that** the hour of waking mattered far less than they **had expected**. What mattered was whether the hour **was the same** every day.",
 "One participant **told the team** she **had been getting up** at ten for years and felt perfectly rested. Another **admitted** that he **had tried** the five-a.m. routine for a month and **had ended up** sleeping through two meetings.",
 "The conclusion **has been repeated** ever since: consistency beats heroism. If you **are told** otherwise by an app, the app **is selling** you something."
],
tr:[
 "Ранкові ритуали обговорюють в інтернеті чи не більше за будь-яку іншу звичку. Нам кажуть, що успішні люди прокидаються о п'ятій, що холодний душ радить кожен другий подкаст і що день виграється або програється до восьмої.",
 "Торік у шведському університеті провели дослідження. Чотириста людей попросили описати свої ранки, а їхній сон вимірювали шість тижнів.",
 "Дослідники сказали, що година підйому важила значно менше, ніж вони очікували. Важило те, чи була ця година однаковою щодня.",
 "Одна учасниця розповіла команді, що роками встає о десятій і почувається цілком відпочилою. Інший визнав, що місяць пробував уставати о п'ятій і врешті проспав дві зустрічі.",
 "Висновок відтоді повторюють раз у раз: сталість перемагає героїзм. Якщо застосунок каже інакше — застосунок вам щось продає."
],

{
id:"tx-en4", c:"en", level:"C1", title:"Why we apologise to furniture",
sub:"Пом'якшення, інверсія, колокації",
par:[
 "**Rarely does a British person** get through a day without saying sorry to an object. Bump into a chair, and out it comes — an automatic apology to a piece of wood.",
 "**Arguably**, this has little to do with guilt. Sorry in British English **tends to** work as social lubricant: it softens a request, marks a small failure, or simply fills the silence where a stranger might otherwise feel judged.",
 "**Admittedly**, foreigners find it baffling. **That said**, most of them adopt it within months, usually without noticing. **Not only is it contagious**, but it also turns out to be surprisingly useful.",
 "**It is worth pointing out** that the word carries almost no weight in these contexts. **What actually signals regret** is a full sentence: I'm really sorry about yesterday. **Only then** does the apology mean anything.",
 "**Had I known this** before I moved, I would have spent less time wondering what I had done wrong. **In fairness**, nobody explains it. You **pick it up** the way you pick up an accent — by **bumping into** it repeatedly."
],
tr:[
 "Рідко коли британець проживе день, не вибачившись перед якимось предметом. Наштовхнувся на стілець — і воно саме вилітає: автоматичне вибачення перед шматком дерева.",
 "Можна стверджувати, що з провиною це майже не пов'язано. «Sorry» в британській англійській працює як соціальне мастило: пом'якшує прохання, позначає дрібну невдачу або просто заповнює тишу, у якій незнайомець міг би почуватися осудженим.",
 "Мушу визнати, іноземців це спантеличує. Втім, більшість переймає це за кілька місяців, зазвичай не помічаючи. Воно не лише заразне, а й напрочуд корисне.",
 "Варто зауважити, що в таких контекстах слово майже нічого не важить. Справжній жаль сигналізує ціле речення: «Мені дуже прикро за вчорашнє». Лише тоді вибачення щось означає.",
 "Знала б я це до переїзду — менше часу гадала б, що ж я зробила не так. Справедливості заради, ніхто цього не пояснює. Це підхоплюєш, як підхоплюють акцент — постійно на нього натикаючись."
],

par:[

 "Yo **camino** por el barrio. **Hay** muchas naranjas en los árboles, pero la gente dice que **están** muy amargas y nadie las **come**.",
 "A las dos **hace** mucho calor. Las tiendas **están** cerradas y las calles **están** vacías. **Es** normal aquí: la gente **come** en casa y **descansa**.",
 "Por la noche la ciudad **es** otra. **Estoy** cansada, pero **quiero** salir. **Vamos** a un bar pequeño donde **hay** música y **hablamos** hasta muy tarde."
],

 "Мене звати Оля, і я з України. Зараз я в Севільї, у подруги. Її квартира маленька, але дуже близько до центру.",
 "Уранці ми снідаємо на кухні: кава з молоком і тости з помідором. Подруга працює в книгарні й виходить о дев'ятій.",

 "Увечері місто інакше. Я втомлена, але хочу вийти. Ми йдемо в маленький бар, де грає музика, і розмовляємо до пізньої ночі."
],

par:[
 "Los sábados **me despierto** tarde, sobre las diez. No **pongo** el despertador porque **me gusta** dormir sin prisa.",
 "**Me levanto**, **me ducho** y **me pongo** ropa cómoda. Luego **preparo** un desayuno grande: huevos, pan y mucho té.",
 "**Me encanta** la primera hora del sábado, cuando la casa **está** en silencio. **Me siento** en el sofá con un libro y **no hago** nada más.",
 "Por la tarde **me reúno** con mis amigas. A ellas **les gusta** el cine, pero a mí **me apetece** más caminar y hablar.",
 "Por la noche **me acuesto** temprano, sobre las once. **Me da igual** que sea sábado: **me siento** mejor cuando duermo bien."
],

sub:"Imperfecto проти indefinido",
par:[
 "Cuando **era** niña, **pasaba** todos los veranos en el pueblo de mi abuela. La casa **era** vieja y **olía** a manzanas.",
 "Cada mañana mi abuela **se levantaba** a las cinco, **encendía** el fuego y **hacía** pan. Yo **dormía** hasta las nueve, porque nadie me **despertaba**.",
 "Un verano, cuando **tenía** doce años, **llegó** una familia nueva al pueblo. Su hija **se llamaba** Marta y **fue** mi primera amiga de verdad.",
 "**Pasábamos** los días en el río. Una tarde **empezó** una tormenta enorme y **nos escondimos** dos horas debajo de un puente. **Estábamos** empapadas y **nos reíamos** como locas.",
 "Aquel verano **terminó** en septiembre y no **volví** a ver a Marta. Pero cada vez que **huelo** manzanas, **vuelvo** a tener doce años."
],
tr:[
 "Коли я була дитиною, я проводила всі літа в бабусиному селі. Дім був старий і пахнув яблуками.",
 "Щоранку бабуся вставала о п'ятій, розпалювала вогонь і пекла хліб. Я спала до дев'ятої, бо мене ніхто не будив.",
 "Одного літа, коли мені було дванадцять, у село приїхала нова родина. Їхню доньку звали Марта, і вона стала моєю першою справжньою подругою.",
 "Ми проводили дні на річці. Одного дня почалася величезна гроза, і ми дві години ховалися під мостом. Ми були мокрі до нитки й реготали як божевільні.",
 "Те літо скінчилося у вересні, і Марту я більше не бачила. Але щоразу, коли я чую запах яблук, мені знову дванадцять."
],

sub:"Субхунтив, futuro, condicional",
par:[
 "Querida yo del futuro: espero que **estés** bien y que **hayas** dormido más que yo este año.",
 "Cuando **leas** esto, probablemente ya **sabrás** si aquella decisión **fue** buena. Yo todavía no lo sé, y me da miedo que **sea** un error.",
 "Te pido que no **te castigues** por lo que no **saliera** como querías. Aunque **sea** difícil, intenta recordar que hace un año no **tenías** ni la mitad de lo que tienes ahora.",
 "Ojalá **hayas** aprendido a decir que no. Si **tuviera** que elegir una sola cosa para ti, **elegiría** eso: que **descanses** sin sentirte culpable.",
 "Y si nada **ha cambiado**, tampoco pasa nada. **Seguiré** escribiéndote hasta que una de las dos **aprenda**."
],
tr:[
 "Дорога я з майбутнього: сподіваюся, у тебе все гаразд і що ти спала більше, ніж я цього року.",
 "Коли ти це читатимеш, то, мабуть, уже знатимеш, чи те рішення було добрим. Я досі не знаю, і мені страшно, що це помилка.",
 "Прошу тебе не картати себе за те, що вийшло не так, як хотілося. Хай навіть це складно, спробуй згадати, що рік тому ти не мала й половини того, що маєш зараз.",
 "Хоч би ти навчилася казати «ні». Якби мені довелося обрати для тебе одну-єдину річ, я обрала б саме це: щоб ти відпочивала без почуття провини.",
 "А якщо нічого не змінилося — теж нічого страшного. Я писатиму тобі, доки одна з нас не навчиться."
],

const COURSES = {
  en:{id:"en",name:"Англійська",tag:"EN",sub:"від B1 і далі",a1:"#FFC46B",a2:"#FF6FA5",aL:"#D2548A",aD:"#FF9DC4",

  es:{id:"es",name:"Іспанська",tag:"ES",sub:"з нуля",a1:"#FFA36B",a2:"#F1568F",aL:"#D24C7C",aD:"#FF97BE",
      levels:[{id:"A0",d:"перші кроки"},{id:"A1",d:"базовий"},{id:"A2",d:"передсередній"},{id:"B1",d:"середній"},{id:"B2",d:"вище середнього"}],
      lessons:ES_LESSONS}
};
Object.values(COURSES).forEach(c=>{
  const ord=c.levels.map(l=>l.id);
  c.lessons.sort((a,b)=>ord.indexOf(a.level)-ord.indexOf(b.level));
  c.lessons.forEach((l,i)=>{ l.num=i+1; });
});
const ALL = [...EN_LESSONS,...ES_LESSONS];
const courseOf = id => id.startsWith("en") ? COURSES.en : COURSES.es;

/* ---------------- сховище ---------------- */
const KEY = "verba.v1";
const OLDKEY = "movnyk.v1";
const mem = {};
const store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); return r ? r.value : null; } }catch(e){}
    try{ const v = localStorage.getItem(k); if(v!==null) return v; }catch(e){}
    return mem[k] ?? null;
  },
  async set(k,v){
    mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k,v); return; } }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){}
  }
};
let P = {xp:0, days:[], lessons:{}, cards:[], log:{}, theme:"light", goal:60, errs:[]};
const today = () => new Date().toISOString().slice(0,10);
const plusDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
async function loadP(){
  let raw = await store.get(KEY);
  if(!raw) raw = await store.get(OLDKEY);   // перенесення прогресу зі старої назви
  if(raw){ try{ P = Object.assign({xp:0,days:[],lessons:{},cards:[],log:{},theme:"light",goal:60,errs:[]}, JSON.parse(raw)); }catch(e){} }
  if(!Array.isArray(P.cards)) P.cards=[];
  if(!P.log||typeof P.log!=="object") P.log={};
  if(!Array.isArray(P.errs)) P.errs=[];
  if(!P.goal) P.goal=60;
  if(P.theme!=="dark") P.theme="light";
  applyTheme();
}
let saveTimer=null;
function saveP(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>store.set(KEY,JSON.stringify(P)),150); }
function touchDay(){ const t=today(); if(!P.days.includes(t)){ P.days.push(t); P.days=P.days.slice(-400); } }
function addXp(n){ P.xp=(P.xp||0)+n; P.log[today()]=(P.log[today()]||0)+n; touchDay(); saveP(); }
const todayXp = () => P.log[today()]||0;
function lp(id){ if(!P.lessons[id]) P.lessons[id]={}; return P.lessons[id]; }
function streak(){
  if(!P.days.length) return 0;
  const set=new Set(P.days); let n=0; const d=new Date();
  if(!set.has(d.toISOString().slice(0,10))) d.setDate(d.getDate()-1);
  while(set.has(d.toISOString().slice(0,10))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function doneCount(c){ return c.lessons.filter(l=>lp(l.id).done).length; }
function isOpen(c,i){ return i===0 || !!lp(c.lessons[i-1].id).done; }

/* ---------------- текст ---------------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ea = s => esc(s).replace(/"/g,"&quot;");
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
const hl = s => esc(s).replace(/~(.+?)~/g,'<b class="m">$1</b>');
function norm(s){
  return String(s).toLowerCase().replace(/[’‘`]/g,"'")
    .replace(/[¿¡.,!?;:«»"()]/g,"").replace(/\s+/g," ").trim();
}
function bare(s){ return norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function same(a,b){ return norm(a)===norm(b) || bare(a)===bare(b); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const clean = s => String(s).replace(/\s*\(.*?\)\s*/g," ").replace(/^to\s+/,"").replace(/\s*\/\s*/g," , ").replace(/\+.*$/,"").trim();

/* ---------------- голос ---------------- */
let voices=[]; let sRate=0.9;
const canSpeak = typeof window!=="undefined" && "speechSynthesis" in window;
function loadVoices(){ try{ voices = window.speechSynthesis.getVoices()||[]; }catch(e){ voices=[]; } }
if(canSpeak){ loadVoices(); try{ window.speechSynthesis.onvoiceschanged=loadVoices; }catch(e){} }
function say(text,lang){
  if(!canSpeak || !text) return;
  try{
    const u=new SpeechSynthesisUtterance(String(text).replace(/[~*`]/g,""));
    const pref = lang==="es" ? "es" : "en";
    u.lang = lang==="es" ? "es-ES" : "en-GB";
    const v = voices.find(x=>x.lang && x.lang.toLowerCase().replace("_","-").startsWith(pref));
    if(v) u.voice=v;
    u.rate=sRate;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
const spkPill = (text,lang,label) => `<button class="spkpill" data-s="${ea(text)}" onclick="say(this.dataset.s,'${lang}');event.stopPropagation()">♪ ${esc(label)}</button>`;
const spk = (text,lang) => `<button class="spk" data-s="${ea(text)}" onclick="say(this.dataset.s,'${lang}');event.stopPropagation()" aria-label="Прослухати">♪</button>`;

/* ---------------- картки ---------------- */
const STEPS=[0,1,2,4,8,16,35];
const cardId=(c,w)=>c+":"+norm(w);
function addCard(c,w,t,s,own,kind){
  const id=cardId(c,w);
  if(P.cards.some(x=>x.id===id)) return false;
  P.cards.push({id,c,w,t,s:s||"",own:own?1:0,kind:kind||"word",box:0,due:today()});
  return true;
}
function addLessonCards(lid,what){
  const l=ALL.find(x=>x.id===lid), c=courseOf(lid).id;
  let n=0;
  if(what!=="pats") l.words.forEach(w=>{ if(addCard(c,w.w,w.t,w.s,0,"word")) n++; });
  if(what!=="words") l.pats.forEach(p=>{ if(addCard(c,p.f,p.t,p.s,0,"pat")) n++; });
  saveP(); return n;
}
const kindOf = x => x.kind || "word";
function courseCards(cid){ return P.cards.filter(x=>x.c===cid); }
function dueCards(cid){ const t=today(); return courseCards(cid).filter(x=>!x.due || x.due<=t); }
function delCard(id){ P.cards=P.cards.filter(x=>x.id!==id); saveP(); render(); }
function learned(cid){ return courseCards(cid).filter(x=>x.box>=4).length; }
function plural(n,a,b,c){ const m=n%100, k=n%10; if(m>=11&&m<=14) return c; if(k===1) return a; if(k>=2&&k<=4) return b; return c; }

function setAccent(c){

  r.setProperty("--a1", c ? c.a1 : "#FFC46B");
  r.setProperty("--a2", c ? c.a2 : "#FF6FA5");
  r.setProperty("--a", c ? (dark?c.aD:c.aL) : (dark?"#FF9DC4":"#D2548A"));
}
function ring(pct,size,stroke,label){
  const r=(size-stroke)/2, cx=size/2, len=2*Math.PI*r, id="g"+Math.random().toString(36).slice(2,7);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:0 0 auto">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--a1)"/><stop offset="1" stop-color="var(--a2)"/></linearGradient></defs>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${len}" stroke-dashoffset="${len*(1-Math.min(pct,1))}" transform="rotate(-90 ${cx} ${cx})"/>
    ${label?`<text x="${cx}" y="${cx+5}" text-anchor="middle" font-family="Unbounded,sans-serif" font-size="${size*0.22}" fill="var(--text)">${label}</text>`:""}
  </svg>`;
}
function header(title, back){

}

function phraseOfDay(){
  const pool=[];
  ALL.forEach(l=>{ const c=courseOf(l.id).id;
    l.pats.forEach(p=>pool.push({t:p.s,u:p.t,c}));
    l.words.forEach(w=>pool.push({t:w.s,u:w.t,c}));
  });
  const d=today(); let h=0;
  for(let i=0;i<d.length;i++) h=(h*31+d.charCodeAt(i))>>>0;
  return pool[h%pool.length];
}

function setGoal(n){ P.goal=n; saveP(); render(); toast("Ціль дня: "+n+" XP"); }
function exportP(){
  try{
    const blob=new Blob([JSON.stringify(P)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="verba-"+today()+".json";

    toast("Файл збережено");

}
function importP(input){
  const f=input.files && input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(typeof d!=="object" || d===null) throw 0;
      P=Object.assign({xp:0,days:[],lessons:{},cards:[],log:{},theme:"light",goal:60,errs:[]}, d);
      if(!Array.isArray(P.errs)) P.errs=[];
      if(!Array.isArray(P.cards)) P.cards=[];
      applyTheme(); saveP(); render(); toast("Прогрес відновлено");
    }catch(e){ toast("Файл не підходить"); }
  };
  r.readAsText(f);
}

/* ---------------- база ---------------- */
let baseMode="gram", baseQ="";
function tabBase(c){
  const chip=(id,l)=>`<button class="chip ${baseMode===id?"on":""}" onclick="baseMode='${id}';render()">${l}</button>`;
  return `<div class="search"><input type="text" id="bq" placeholder="Пошук за темою, словом або перекладом" value="${ea(baseQ)}" oninput="baseQ=this.value;renderBaseList()"></div>
    <div class="chiprow">${chip("gram","Граматика")}${chip("words","Слова")}${chip("pats","Конструкції")}${chip("texts","Тексти")}</div>
    <div id="baseList">${baseList(c)}</div>`;
}
function renderBaseList(){
  const el=document.getElementById("baseList");
  if(el) el.innerHTML=baseList(COURSES[view.c]);
}
function baseList(c){
  const q=norm(baseQ);
  if(baseMode==="texts") return tabTexts(c);
  if(baseMode==="gram"){
    const ls=c.lessons.filter(l=>!q || norm(l.title+" "+l.short+" "+l.goal).includes(q));
    if(!ls.length) return `<div class="empty">Нічого не знайшлося. Спробуйте інше слово — наприклад, «пасив» або «артикль».</div>`;
    return ls.map(l=>`<div class="acc" id="acc-${l.id}">
      <button onclick="document.getElementById('acc-${l.id}').classList.toggle('open')">
        <span class="lvtag">${l.level}</span><h3>${esc(l.title)}</h3><span style="color:var(--dim)">▾</span>
      </button>
      <div class="body"><div class="tx">${theory(l,c.id)}</div>${moreBlock(l,c.id)}
        <button class="btn ghost sm" onclick="go({s:'lesson',id:'${l.id}'})">Відкрити урок повністю</button></div>
    </div>`).join("");
  }
  if(baseMode==="words"){
    let rows=[];
    c.lessons.forEach(l=>l.words.forEach(w=>{ if(!q||norm(w.w+" "+w.t+" "+w.s).includes(q)) rows.push({w,tag:String(l.num)}); }));
    courseCards(c.id).filter(x=>x.own).forEach(x=>{ if(!q||norm(x.w+" "+x.t+" "+x.s).includes(q)) rows.push({w:{w:x.w,t:x.t,s:x.s},tag:"моє"}); });
    if(!rows.length) return `<div class="empty">Такого слова в базі поки немає — його можна додати своєю карткою у вкладці «Картки».</div>`;
    return `<div class="card">${rows.map(r=>`<div class="word">
      ${spk(clean(r.w.w),c.id)}
      <div class="l"><div class="w">${esc(r.w.w)}</div><div class="tr">${esc(r.w.t)}</div><div class="s">${esc(r.w.s)}</div></div>
      <span class="box">${esc(r.tag)}</span></div>`).join("")}</div>`;
  }
  let rows=[];
  c.lessons.forEach(l=>l.pats.forEach(p=>{ if(!q||norm(p.f+" "+p.t+" "+p.s).includes(q)) rows.push(p); }));
  if(!rows.length) return `<div class="empty">Конструкції за цим запитом не знайдено.</div>`;
  return `<div class="card">${rows.map(p=>`<div class="pat"><div class="f">${esc(p.f)}</div><div class="t">${esc(p.t)}</div>
    <div class="s">${esc(p.s)} ${spk(p.s,c.id)}</div></div>`).join("")}</div>`;
}

/* ---------------- тренажер ---------------- */
let trainScope="all";
function tabTrain(c){
  const chips=[{id:"all",l:"Усі рівні"}].concat(c.levels.map(l=>({id:l.id,l:l.id})));
  const box=(title,text,fn,ghost)=>`<div class="card"><h3 style="font-family:'Onest';font-size:16px;font-weight:700;margin-bottom:6px">${title}</h3>
    <p style="margin:0 0 4px;color:var(--dim);font-size:14px">${text}</p>
    <button class="btn ${ghost?"ghost":""}" onclick="${fn}">Почати</button></div>`;
  return `<div class="chiprow" style="margin-top:16px">${chips.map(x=>`<button class="chip ${trainScope===x.id?"on":""}" onclick="trainScope='${x.id}';render()">${x.l}</button>`).join("")}</div>
    ${box("Граматичні вправи","10 випадкових завдань із тем обраного рівня — вибір, підстановка, переклад.","startTrain('gram')")}
    ${box("Тренування слів","12 слів із бази та ваших карток: обираєте правильний переклад.","startTrain('words')",1)}
    ${box("Аудіювання","8 фраз уголос — прослухайте й запишіть те, що почули.","startTrain('listen')",1)}
    ${box("Слабкі місця","Вправи з уроків, де минулого разу було найбільше помилок.","startTrain('weak')",1)}
    ${box("Щоденник помилок","У журналі "+courseErrs(c.id).length+" "+plural(courseErrs(c.id).length,"запис","записи","записів")+". Кожна помилка зберігається з поясненням, доки ви її не виправите.","go({s:'errors',c:'"+c.id+"'})",1)}
    ${canSpeak?"":'<div class="warn"><b>Звук</b>Цей браузер не вміє озвучувати текст, тому аудіювання тут не працюватиме. У Chrome на Android і в Safari на iPhone усе гаразд.</div>'}`;
}
function scopeLessons(c){ return trainScope==="all" ? c.lessons : c.lessons.filter(l=>l.level===trainScope); }
function startTrain(kind){
  const c=COURSES[view.c], ls=scopeLessons(c);
  let items=[];
  if(kind==="words"){
    let pool=[]; ls.forEach(l=>l.words.forEach(w=>pool.push({w:w.w,t:w.t,s:w.s})));
    if(trainScope==="all") courseCards(c.id).filter(x=>x.own).forEach(x=>pool.push({w:x.w,t:x.t,s:x.s}));
    const all=pool.slice();
    items=shuffle(pool).slice(0,12).map(w=>{
      const wrong=shuffle(all.filter(x=>x.t!==w.t)).slice(0,3).map(x=>x.t);
      const opts=shuffle([w.t,...wrong]);
      return {t:"choice",q:w.w,hint:"Оберіть переклад",o:opts,a:opts.indexOf(w.t),why:w.s};
    });
  }else if(kind==="listen"){
    if(!canSpeak){ toast("Цей браузер не вміє озвучувати текст"); return; }
    let pool=[];
    ls.forEach(l=>{ l.words.forEach(w=>pool.push({text:w.s,tr:w.t})); l.pats.forEach(p=>pool.push({text:p.s,tr:p.t})); });
    items=shuffle(pool).slice(0,8).map(x=>({t:"listen",text:x.text,lang:c.id,why:x.tr}));
  }else if(kind==="errs"){
    items=shuffle(courseErrs(c.id)).slice(0,12).map(e=>Object.assign({},e.item,{from:e.from}));
  }else{
    let src=ls;
    if(kind==="weak"){
      const scored=ls.map(l=>({l,r:lp(l.id).rate ?? 2})).sort((a,b)=>a.r-b.r).slice(0,4).map(x=>x.l);
      src=scored.length?scored:ls;
    }
    let pool=[]; src.forEach(l=>l.ex.forEach(e=>pool.push(Object.assign({},e,{from:l.title}))));
    items=shuffle(pool).slice(0,10);
  }
  if(!items.length){ toast("Немає завдань для цього рівня"); return; }
  go({s:"ex", mode:"train", c:view.c, items, i:0, ok:0, log:[]});
}

    ${list.length?`<div class="card">${list.slice(0,300).map(x=>`<div class="crow">

function editCard(id){
  const x=P.cards.find(y=>y.id===id); if(!x) return;
  editId=id; nw={w:x.w,t:x.t,s:x.s||""}; formOpen=true; render();
  setTimeout(()=>{ const e=document.getElementById("nw"); if(e) e.focus(); },50);
}
function saveOwn(){
  const w=(document.getElementById("nw").value||"").trim();
  const t=(document.getElementById("nt").value||"").trim();
  const s=(document.getElementById("ns").value||"").trim();
  if(!w || !t){ toast("Потрібні і слово, і переклад"); return; }
  if(editId){
    const card=P.cards.find(x=>x.id===editId);
    if(card){
      const newId=cardId(card.c,w);
      if(newId!==card.id && P.cards.some(x=>x.id===newId)){ toast("Така картка вже є"); return; }
      card.id=newId; card.w=w; card.t=t; card.s=s;
    }
    editId=null; nw={w:"",t:"",s:""}; formOpen=false; saveP(); render(); toast("Збережено");
    return;
  }
  if(!addCard(view.c,w,t,s,1,"word")){ toast("Така картка вже є"); return; }
  nw={w:"",t:"",s:""}; formOpen=false; addXp(2); saveP(); render(); toast("Картку додано");
}
function startSrs(){
  const q=shuffle(dueCards(view.c)).map(x=>x.id);
  if(!q.length){ toast("На сьогодні немає карток"); return; }
  go({s:"srs", c:view.c, q, i:0, shown:false, ok:0, done:0});
}
function srsPool(card){
  const same=P.cards.filter(x=>x.c===card.c && x.id!==card.id && kindOf(x)===kindOf(card));
  return same.length>=3 ? same : P.cards.filter(x=>x.c===card.c && x.id!==card.id);
}
function srsPrep(){
  const card=P.cards.find(x=>x.id===view.q[view.i]);
  if(!card){ view.prep=view.i; return; }
  const pool=srsPool(card), b=card.box||0;
  view.mode = pool.length<3 ? "flip" : b<=1 ? "pick" : b<=3 ? "back" : "type";
  view.shown=false; view.checked=null; view.opts=null;
  if(view.mode==="pick"||view.mode==="back"){
    const key = view.mode==="pick" ? "t" : "w";
    const wrong=shuffle(pool.filter(x=>norm(x[key])!==norm(card[key]))).slice(0,3).map(x=>x[key]);
    view.opts=shuffle([card[key],...wrong]);
  }
  view.prep=view.i;
}
function srsAnswers(card){
  const a=[card.w, clean(card.w)];
  if(kindOf(card)==="pat" && card.s) a.push(card.s);
  return a.filter(Boolean);
}
function maskWord(w){
  return String(w).split(" ").map(x=>x.length>1 ? x[0]+"·".repeat(Math.min(x.length-1,9)) : x).join(" ");
}
const STAGE_NAME=["впізнавання","впізнавання","зворотний вибір","зворотний вибір","з підказкою","самостійно","закріплено"];

    face=`<div class="face">
      <div class="fw" style="font-size:21px">${esc(card.t)}</div>
      <div class="tip">${isPat?"напишіть конструкцію":"напишіть "+(c.id==="en"?"англійською":"іспанською")}</div>

      ${view.shown?`<div class="ft">${esc(card.t)}</div>${card.s?`<div class="fs">${esc(card.s)}</div>`:""}`:`<div class="tip">натисніть, щоб побачити переклад</div>`}
    </div>`;
    controls = view.shown

  }

  const st=Math.min(card.box||0,6);
  return header("Картки · "+(view.i+1)+" з "+view.q.length,`go({s:'course',c:'${c.id}',tab:'cards'})`)+`<div class="wrap">
    <div class="stagebar">${[0,1,2,3,4,5,6].map(i=>`<i class="${i<st?"on":i===st?"cur":""}"></i>`).join("")}
      <span>${STAGE_NAME[st]}</span></div>
    ${face}${controls}
    <div class="foot">етап ${st} з 6 · ${isPat?"конструкція":"слово"} · ${card.own?"ваша картка":"зі словника уроків"}</div>

function srsPick(k){
  if(view.checked) return;
  const card=P.cards.find(x=>x.id===view.q[view.i]);
  const key = view.mode==="pick" ? "t" : "w";
  const ok = norm(view.opts[k])===norm(card[key]);
  view.checked={ok};
  const btns=[...document.querySelectorAll("#srsopts .opt")];
  view.pending=ok;
  render();
}
function srsType(reveal){
  if(view.checked) return;
  const card=P.cards.find(x=>x.id===view.q[view.i]);
  const el=document.getElementById("srsans");
  const v=el?el.value:"";
  const ok = !reveal && srsAnswers(card).some(a=>same(a,v));
  view.checked = ok ? {ok:true} : {ok:false, self:true, typed:v};
  view.pending = ok;
  render();
}
function srsNext(){ srsGrade(view.pending===true); }
function srsGrade(okFlag){
  const card=P.cards.find(x=>x.id===view.q[view.i]);
  view.done++;
  if(okFlag){
    card.box=Math.min((card.box||0)+1,STEPS.length-1);
    card.due=plusDays(STEPS[card.box]||1);
    view.ok++; addXp(5);
  }else{
    card.box=Math.max((card.box||0)-2,0);
    card.due=today();
    view.q.push(card.id);
    touchDay();
  }
  saveP(); view.checked=null; view.pending=null; view.shown=false; view.i++;
  render(); window.scrollTo(0,0);
}
